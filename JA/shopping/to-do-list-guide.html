    <h1>外出先の用事を覚えておく</h1>
    <p>薬を受け取る、合鍵を作る、金物店に寄るなどの用事を書き、「追加」を押します。</p>
    <p>チェックで完了を示し、外せば未完了に戻ります。×で削除できます。用事は在庫や買い物リストには影響しません。</p>
