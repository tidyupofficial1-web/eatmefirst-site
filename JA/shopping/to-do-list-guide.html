    <h1>やることリストの使い方</h1>
    <p>外出のついでに済ませたい用事を書いておきます。たとえば合鍵を作る、書店や文具店に寄る、薬局で買い物をする、クリーニングを受け取る、支払いや荷物の受け取りを済ませるなどです。</p>
    <p>済んだ用事にチェックを入れると、行が暗くなり取り消し線が付きます。まだならチェックを外せます。削除は×です。「直近15件の操作」で最近の操作と、取り消せるものを確認できます。</p>
