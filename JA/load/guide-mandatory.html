    <h1>厳守する期限の設定</h1>
    <p>「消費期限」のように守る日付には「厳守する期限」を選び、日付を入力します。10日前から赤い表示が出て、期限を過ぎても赤のままです。あと何日か、明日、今日、何日過ぎたかが表示されます。</p>
    <p>選択しない場合は目安の日付です。日数や月数で設定した目安は、10日を超えていると黄色、残り10日以内では確認を促す赤になります。赤になっても目安のままです。日数・月数・カレンダーは入力方法で、期限の種類は自分で選びます。アプリは期限を延ばしたり、商品を削除したり、食品の安全を判定したりしません。包装の表示に従ってください。</p>
