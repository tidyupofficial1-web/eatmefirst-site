    <h1>保管場所を決める</h1>
    <p>商品を置く場所を指定します。前回使った場所が表示されたら、今回も同じか確かめてください。初めての場所は「地下の冷凍庫」や「ワイン棚」のように自由に入力できます。</p>
    <p>商品がなくなった後も、覚えた場所は候補に残ります。同じ場所なら既存の名前を選びます。大文字・小文字と空白の違いは整理されますが、「ワイン棚」と「ワインの保管庫」は別の名前です。今回の入力を変えても過去の保管場所は変わりません。家のどこにあるか分かる名前を付けましょう。</p>
    <p><a href="load.html">商品登録に戻る</a></p>
