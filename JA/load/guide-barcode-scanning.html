<h1>バーコードを読み取る</h1>
<p>「バーコードを読み取る」を押し、カメラの使用を許可して、明るい場所でコードを枠内に合わせます。読み取れない場合は先頭のゼロも含めて8～14桁の番号を入力できます。</p>
<p>オンライン検索を使うとコードが外部カタログに送られます。結果を確認し、必要なら商品名や数量を修正してください。市場の野菜などコードがない商品も手入力で登録できます。</p>
