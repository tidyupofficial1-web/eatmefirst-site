<body>
<main class="wrap section">
    <h1>購入した店を記録する</h1>
    <p>スーパー、市場、近所の店などを任意で記録できます。前回入力した店が表示されるので、今回違う店なら変更します。商品詳細でも確認できます。店名の先頭を入力するとすべての店から選べる仕組みではありません。</p>
    <p>統計では在庫に残っている商品の店を表示し、店別に絞れます。表示されるのは在庫の行数です。レシート、来店回数、支出を数えているわけではありません。</p>
    <p><a href="load.html">商品登録に戻る</a></p>
