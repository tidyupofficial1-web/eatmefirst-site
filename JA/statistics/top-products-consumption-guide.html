    <h1>消費ペースの見方</h1>
    <p>最初に、保管場所をまたいで同じ商品の現在庫をまとめます。未開封2個と半分残った1個なら2.5個分です。在庫の行数は登録の件数なので、個数とは異なります。</p>
    <p>後半は記録のある範囲で直近30日間の取り出しと一部消費を表示します。保管場所の移動は集計せず、操作を取り消すと合計も戻ります。取り出しでは消費と廃棄をまだ区別していません。古い記録の復元や、全期間で一番購入した商品の集計は行いません。</p>
