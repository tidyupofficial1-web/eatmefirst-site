    <h1>EatMeFirstを更新する</h1>
    <p>更新はサイトで公開されます。インターネットに接続してアプリを開き直し、表示されなければページを再読み込みします。更新用ファイルのダウンロードは不要です。ページが新しくなっても、商品やメモは端末に残ります。</p>
    <p>在庫の書き出しはデータの控えを作る機能です。ユーティリティで書き出し、ダウンロードを確認します。控えはUSBメモリや別の端末に置くと復元に使えます。</p>
    <p>スマホとパソコンのデータは自動で同期しません。一方で書き出し、もう一方で読み込みます。ファイルの内容で今のデータが置き換わるので、確定前に概要を確認します。</p>
