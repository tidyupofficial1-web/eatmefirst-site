<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>家族の予定表 | EatMeFirst</title>
  <link rel="stylesheet" href="../../sito-bozza/assets/site.css">
  <script defer src="../../js/agenda-texts.js?v=language-preview"></script>
  <script defer src="../../js/agenda-it.js?v=language-preview"></script>
</head>
<body>
  <header class="site-header wrap"><a class="brand" href="../../sito-bozza/JA/index.html">EatMeFirst</a><nav class="actions" aria-label="使い方"><a href="../menu.html">アプリのメニュー</a><a href="../../sito-bozza/JA/agenda.html">使い方</a></nav></header>
  <main class="wrap section">
    <h1>家族の予定表</h1>
    <div class="actions">
      <button type="button" id="example" aria-pressed="false">エヴァの例で試す</button>
      <button type="button" id="personal" aria-pressed="true">自分の予定表</button>
    </div>
    <p id="mode"></p>
    <div class="actions" id="sample-controls">
      <button type="button" id="clear-example">練習用の予定を消去</button>
      <button type="button" id="load-example">例を読み直す</button>
    </div>
    <form id="event-form">
      <h2 id="form-heading">新しい予定</h2>
      <p><label>件名 <input name="title" required maxlength="100"></label></p>
      <p><label>日付 <input name="day" type="date" required></label> <label>時刻 <input name="time" type="time"></label></p>
      <p><label>メモ <input name="note" maxlength="250"></label></p>
      <p><label><input name="weekly" type="checkbox"> 毎週繰り返す</label></p>
      <div class="actions"><button type="submit" class="button">予定を保存</button><button type="button" id="cancel-edit" hidden>編集を取り消す</button></div>
    </form>
    <p id="status" role="status"></p>
    <h2>今日とこれからの予定</h2>
    <ul id="upcoming" class="advice-list"></ul>
    <details><summary>終了した予定</summary><ul id="past" class="advice-list"></ul></details>
    <noscript>予定表を使うにはJavaScriptを有効にしてください。</noscript>
  </main>
</body>
</html>
