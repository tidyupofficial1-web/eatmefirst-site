    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory and product dates | EatMeFirst</title>
    <meta name="description" content="Monitora le scorte della tua dispensa in tempo reale con l'inventario digitale EatMeFirst: filtri avanzati, controllo scadenze e tracciamento operazioni.">
    <meta name="robots" content="noindex">

    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-color: #f0f6fc;
            --text-muted: #8b949e;
            --accent-color: #58a6ff;
            --success-color: #238636;
            --success-hover: #2ea043;
            --danger-color: #f85149;
            --warning-color: #d29922;
            --border-color: #30363d;
            --light-bg: #21262d;
            --input-bg: #0d1117;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .app-bar {
            background: rgba(22, 27, 34, 0.95);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 40;
        }

        .app-brand { display: flex; align-items: center; gap: 12px; }
        .btn-back {
            background: var(--light-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 13.5px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-back:hover { border-color: var(--accent-color); color: var(--accent-color); }

        .brand-title { font-size: 18px; font-weight: bold; color: var(--text-color); }

        .app-nav-right { display: flex; align-items: center; gap: 12px; }

        .language-flags {
            display: flex;
            gap: 6px;
            align-items: center;
            background: var(--light-bg);
            padding: 4px 8px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        .flag-link {
            text-decoration: none;
            display: flex;
            align-items: center;
            opacity: 0.7;
            transition: opacity 0.2s, transform 0.2s;
        }

        .flag-link:hover, .flag-link.active { opacity: 1; transform: scale(1.1); }
        .flag-img { width: 20px; height: 14px; object-fit: cover; border-radius: 2px; }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 16px;
            width: 100%;
        }

        .narrative-card {
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            margin-bottom: 24px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
        }

        .hero-img {
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            display: block;
        }

        .narrative-content { padding: 24px; }
        .narrative-title { font-size: 22px; color: var(--accent-color); margin-bottom: 15px; font-weight: 700; }
        .narrative-text { font-size: 15.5px; color: var(--text-color); line-height: 1.7; }

        .card-box {
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
        }

        .card-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .card-title {
            font-size: 19px;
            color: var(--accent-color);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-icon-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: transform 0.2s ease;
        }
        .info-icon-link:hover { transform: scale(1.2) rotate(-3deg); }
        .info-icon-img {
            width: 28px;
            height: 28px;
            object-fit: contain;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.4);
        }

        .filtri-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .search-input, .filter-select {
            width: 100%;
            padding: 11px 14px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-input:focus, .filter-select:focus { border-color: var(--accent-color); }

        .product-list { display: flex; flex-direction: column; gap: 10px; }
        .product-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: var(--light-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            transition: border-color 0.2s;
            cursor: pointer;
        }
        .product-item:hover { border-color: var(--accent-color); }

        .product-info-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .product-thumb {
            width: 42px;
            height: 42px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .btn-action {
            background-color: var(--accent-color);
            color: #0d1117;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13.5px;
            transition: opacity 0.2s;
        }
        .btn-action:hover { opacity: 0.85; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85); display: flex; justify-content: center;
            align-items: center; z-index: 100; padding: 20px;
        }
        .modal-content {
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 16px; max-width: 480px; width: 100%; padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
        }

        footer {
            text-align: center; padding: 20px; font-size: 13px;
            color: var(--text-muted); border-top: 1px solid var(--border-color); margin-top: 40px;
        }

        @media (max-width: 768px) {
            .filtri-grid { grid-template-columns: 1fr; }
            /* Bandiere responsive su mobile */
            .language-flags {
                display: flex;
                gap: 4px;
                padding: 2px 6px;
            }
            .flag-img {
                width: 18px;
                height: 12px;
            }
        }
    </style>

<body>

    <header class="app-bar">
        <div class="app-brand">
            <a href="../menu.html" class="btn-back">← メニュー</a>
            <div class="mini-logo" style="display: inline-flex; align-items: center;">
                <img src="../../IMG/logo_1024_white.png" alt="Logo EatMeFirst" style="height: 36px; width: auto; filter: drop-shadow(0px 0px 2px rgba(255, 255, 255, 0.8));">
            </div>
            <span class="brand-title">在庫と期限</span>
        </div>

        <div class="app-nav-right">
            <details class="language-picker"><summary>言語</summary><div class="language-picker-list"><a href="../../IT/inventario/index.html" lang="it">Italiano</a><a href="../../EN/inventory/index.html" lang="en">English</a><a href="../../FR/inventaire/index.html" lang="fr">Français</a><a href="../../DE/inventar/index.html" lang="de">Deutsch</a><a href="../../ES/inventario/index.html" lang="es">Español</a><a href="../../JA/inventory/index.html" lang="ja" aria-current="page">日本語</a><a href="../../PT/inventory/index.html" lang="pt-BR">Português (Brasil)</a><a href="../../AR/inventory/index.html" lang="ar" hreflang="ar" dir="rtl">العربية</a></div></details>
        <a href="../operations/index.html">直近15件の操作</a>
        </div>
    </header>

    <main class="container">
        <div id="sezionePresentazioneInventario">
            <div style="display: flex; justify-content: flex-end; margin-bottom: 8px;">
                <button type="button" onclick="nascondiPresentazione()" style="background: var(--light-bg); color: var(--text-muted); border: 1px solid var(--border-color); padding: 4px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; transition: all 0.2s;" title="この紹介を非表示にする">
                    ✕ 紹介を非表示
                </button>
            </div>

            <article class="narrative-card">
                <img src="../../IT/IMG/sviluppatore-diagramma-inventario-dispensa.png" alt="在庫と期限について説明する開発者" class="hero-img">
                <div class="narrative-content">
                    <h1 class="narrative-title">家には何がある？</h1>
                    <div class="narrative-text">
                        <p>写真、商品名、数量、期限をまとめて確認できます。棚を探し回る必要はありません。マックスは眼鏡を探すだけで済みますね！</p>
                        <p>商品をタップすると詳細やメモを確認できます。使った量、保管場所の変更、リマインダーは「消費」で記録します。黄色い案内には、絞り込みと詳細の使い方が載っています。</p>
                    </div>
                </div>
            </article>
        </div>

        <div class="card-box">
            <div class="card-title-row">
                <div class="card-title">📦 在庫</div>
                <a href="inventory-help-guide.html" class="info-icon-link" title="在庫の使い方">
                    <img src="../../IMG/biglietto_info.jpg" alt="在庫の使い方" class="info-icon-img">
                </a>
            </div>

            <div class="filtri-grid">
                <input type="text" id="filtroNome" class="search-input" placeholder="🔍 商品名で検索…" oninput="filtraInventario()">
                <select id="filtroUbicazione" class="filter-select" onchange="filtraInventario()">
                    <option value="">すべての保管場所</option>
                </select>
                <select id="filtroCategoria" class="filter-select" onchange="document.getElementById('filtroSottocategoria').value=''; EatCategorie.filtri(dispensaGlobale); filtraInventario()">
                    <option value="">すべてのカテゴリ</option>
                </select>
                <select id="filtroSottocategoria" class="filter-select" disabled onchange="filtraInventario()"><option value="">すべてのサブカテゴリ</option></select>
            </div>

            <div id="listaRisultati" class="product-list"></div>
        </div>
    </main>

    <div id="modalDettaglio" class="modal-overlay" style="display:none;">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 style="color: var(--accent-color); font-size: 18px;">📋 商品の詳細</h3>
                <button type="button" onclick="chiudiModalDettaglio()" style="background:none; border:none; color:var(--text-color); font-size:18px; cursor:pointer;">✕</button>
            </div>
            <div id="contenutoDettaglioProdotto"></div>
            <div style="display: flex; justify-content: flex-end; margin-top: 20px;">
                <button type="button" class="btn-action" onclick="chiudiModalDettaglio()">閉じる</button>
            </div>
        </div>
    </div>

    <footer>
        <span>© EatMeFirst · 在庫データは端末に保存されます</span>
    </footer>
