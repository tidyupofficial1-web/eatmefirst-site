  <meta name="description" content="架空の食品を使って、買ったものの登録、在庫の確認、消費の記録、買い物リストの使い方を練習できる親子向けの無料ゲームです。">
  <link rel="canonical" href="https://tidyupofficial1-web.github.io/eatmefirst-site/sito-bozza/JA/gioco.html">

<body>
  <a class="skip" href="#content">本文へ移動</a>
  <header class="site-header wrap">
    <a class="brand" href="index.html">EatMeFirst</a>
    <nav class="actions" aria-label="サイトメニュー"><a href="index.html">親子で食品ストックチャレンジ</a><a href="../EN/gioco.html" lang="en">Play in English</a></nav>
  <nav class="languages" aria-label="言語"><details class="language-picker"><summary>言語</summary><div class="language-picker-list"><a href="../IT/gioco.html" lang="it">Italiano</a><a href="../EN/gioco.html" lang="en">English</a><a href="../FR/gioco.html" lang="fr">Français</a><a href="../DE/gioco.html" lang="de">Deutsch</a><a href="../ES/gioco.html" lang="es">Español</a><a href="gioco.html" lang="ja" aria-current="page">日本語</a></div></details></nav>
  </header>
  <main id="content">
    <section class="wrap page-intro">
      <h1>買い物と食品の管理をゲームで練習しよう</h1>
      <p class="lead">マックス、エヴァ、レオと一緒に、練習用の食品を登録してみましょう。このゲームは実際の在庫データを読み込んだり変更したりしません。ファイルの保存や送信も行いません。ページを再読み込みすると最初から始まります。</p>
    </section>
    <section class="wrap game-shell">
      <img class="game-welcome" src="../assets/trio-pastello-benvenuto-gioco.png" alt="マックス、エヴァ、レオ">
      <div class="game-toolbar"><span id="game-progress"></span><button id="game-restart" type="button">最初からやり直す</button></div>
      <div class="game-layout">
        <div>
          <article class="game-dialogue"><p id="game-speaker" class="speaker"></p><h2 id="game-question" tabindex="-1"></h2><p id="game-hint"></p></article>
          <div id="game-controls" class="game-controls"></div>
          <p id="game-feedback" role="status" aria-live="polite"></p>
          <button id="game-next" type="button" hidden>次へ →</button>
        </div>
        <aside class="game-display"><h3>練習用の食品ストック</h3><div id="game-device"></div><div id="game-stock"></div></aside>
      </div>
      <noscript>ゲームで遊ぶにはJavaScriptを有効にしてください。</noscript>
    </section>
    <section class="wrap closing">
      <div><h2>家にある食品でもやってみよう</h2><p>家族と一緒に、食品を3つ選ぶところから始めましょう。</p></div>
      <a class="button" href="index.html">チャレンジの紹介へ</a>
    </section>
