    <section class="wrap page-intro"><h1>在庫と保管場所を確認する</h1><p class="lead">在庫では冷蔵庫、冷凍庫、食品棚などに何があるか確認できます。早めに使いたい食品や開封した容器も見直せます。園芸用品にも同じ方法を使えます。</p></section>

    <section class="wrap section"><h2>見つけたいものから絞り込む</h2><p>冷蔵庫や物置など、保管場所で在庫を絞り込めます。期限が近い食品を先に確認し、開封済みの商品は残量を見てから買い足すか決めましょう。名前を選ぶと商品の詳細が見られます。</p></section>
