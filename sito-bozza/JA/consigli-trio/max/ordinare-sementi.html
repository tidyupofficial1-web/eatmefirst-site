  <main>
    <section class="wrap page-intro"><h1>種の袋を整理する方法</h1><p class="lead">種まきの時期ごとに袋をまとめ、開封した袋には品種を書いておきます。保管方法は袋の表示に従い、どこに置いたか分かるようにしましょう。</p></section>
    <figure class="wrap advice-picture"><img src="../../../assets/consigli-max-orto.webp" width="1000" height="667" alt=""></figure>
    <section class="wrap section"><p>園芸店へ行く前に、今の季節に使う種を確認します。バジルの袋が二つあるなら、買い物リストには足りない種だけを書きます。</p><p>たとえば、開封したバジルの袋の残りを30％と記録し、保管場所を「物置の箱」にします。種、鉢、培養土などにも同じ方法を使えます。</p></section>
