    <section class="wrap page-intro"><h1>親子で食品ストックに挑戦</h1><p class="lead">10歳くらいから、保護者と一緒に家にある食品を3つ選びます。表示を読んで、保管場所を決め、順番に在庫に登録しましょう。</p></section>
    <section class="wrap section"><p>次はおやつの準備です。使ったものと残ったものを記録します。すでに家にあるものを確認して、足りない分だけ次の買い物リストに入れます。</p><p>練習ゲームは実際の在庫と別です。慣れたら、次に買い物から戻ったときに、いくつかの商品を子どもたちに任せてみましょう。</p><div class="actions"><a class="button" href="gioco.html">ゲームで学ぶ</a></div></section>
