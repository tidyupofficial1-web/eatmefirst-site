  <main class="wrap page-intro"><h1>アプリを開いた回数</h1><p>EatMeFirstは対象画面を開いた回数を集計します。CloudflareはIPアドレスを一時的に使い、日と画面ごとに異なるコードを作成します。同じ日の同じ画面では、同じアドレスを1回と数えます。以前の日のコードは定期的に削除され、日別・画面別の合計が残ります。Do Not TrackとGlobal Privacy Controlを尊重します。この集計にCookieは使用せず、在庫の内容は送信しません。</p><p><a href="index.html">EatMeFirst</a></p></main>
