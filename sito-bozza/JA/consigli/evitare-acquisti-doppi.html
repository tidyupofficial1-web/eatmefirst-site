    <section class="wrap page-intro"><h1>買い物前に在庫を確認して重複を防ぐ方法</h1><p class="lead">冷蔵庫と食品棚を見て、ほしいものが本当に足りないか確かめます。たとえばソースがすでに二瓶あれば、リストに書くのは次の料理に足りない材料だけです。</p></section>
    <section class="wrap section"><a class="button" href="../consigli-trio/max/index.html">ほかのヒント</a></section>
    <section class="wrap section"><h2>買い物前の3分</h2><p>冷蔵庫、食品棚、日用品の収納を順に見ます。未開封の予備があれば買い物リストから外し、開封済みなら残量を確認します。家族が別々に買い足す場合は、出かける前に同じリストを確認します。</p><p><a href="../../../JA/index.html">アプリを開く</a></p></section>
