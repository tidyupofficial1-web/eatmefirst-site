    <section class="wrap section"><a class="button" href="../consigli-trio/eva/index.html">ほかのヒント</a></section>
    <section class="wrap section"><h2>献立を決める前に</h2><p>期限が近い商品を在庫で確認し、今週使うものを選びます。容器を開けたものは残量も記録します。期限の種類や保存方法は包装の表示で確認してください。</p><p><a href="../../../JA/index.html">アプリを開く</a></p></section>
