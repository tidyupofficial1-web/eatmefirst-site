    <section class="wrap page-intro"><h1>冷凍庫の作り置きを見つけやすくする方法</h1><p class="lead">冷凍する容器に料理名と日付を書き、種類ごとに置く場所を決めます。献立を考える前に、残っている数と早めに使いたいものを確認しましょう。</p></section>

    <section class="wrap section"><h2>引き出しごとに管理</h2><p>引き出しに短い名前を付け、容器のラベルに中身と冷凍した日を書きます。古いものを手前に置き、使ったら数量を更新します。残りを別の引き出しへ移したら保管場所も変更します。</p><p><a href="../../../JA/index.html">アプリを開く</a></p></section>
