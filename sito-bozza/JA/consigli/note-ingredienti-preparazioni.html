  <main>
    <section class="wrap page-intro"><h1>食材や手作り料理にメモを付ける方法</h1><p class="lead">料理の名前だけでは分からないときは、材料や使う予定をメモに添えます。たとえば「日曜用」や「ソースは別容器」と書くと、あとで見ても状況が分かります。</p></section>
    <figure class="wrap advice-picture editorial-cover"><img src="../../assets/controllare-scorte-dispensa-lista-spesa.png" width="1536" height="1024" alt="食品棚のパッケージと買い物リスト" loading="lazy"></figure>
    <section class="wrap section"><a class="button" href="../consigli-trio/leo/index.html">ほかのヒント</a></section>
    <section class="wrap section"><h2>あとからわかるメモ</h2><p>料理名、主な材料、作った日を短く書きます。冷蔵庫や冷凍庫のどこに置いたかは保管場所の欄へ。アレルゲンは記憶だけに頼らず、使った包装の表示も確認してください。</p><p><a href="../../../JA/index.html">アプリを開く</a></p></section>
