<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Agenda de casa | EatMeFirst</title>
  <link rel="stylesheet" href="../../sito-bozza/assets/site.css">
  <script defer src="../../js/agenda-texts.js?v=20261126"></script>
  <script defer src="../../js/agenda-it.js?v=20261126"></script>
</head>
<body>
  <header class="site-header wrap"><a class="brand" href="../menu.html">EatMeFirst</a><nav class="actions" aria-label="Menú de la aplicación"><a href="../menu.html">Menú de la aplicación</a><a href="../compra/index.html">Lista de la compra</a><a href="../../sito-bozza/ES/agenda.html">Cómo funciona</a></nav></header>
  <main class="wrap section">
    <h1>Agenda de casa</h1>
    <div class="actions">
      <button type="button" id="example" aria-pressed="false">Probar con Eva</button>
      <button type="button" id="personal" aria-pressed="true">Mi agenda</button>
    </div>
    <p id="mode"></p>
    <div class="actions" id="sample-controls">
      <button type="button" id="clear-example">Vaciar la prueba</button>
      <button type="button" id="load-example">Volver a cargar los ejemplos</button>
    </div>
    <form id="event-form">
      <h2 id="form-heading">Nueva cita</h2>
      <p><label>Título <input name="title" required maxlength="100"></label></p>
      <p><label>Fecha <input name="day" type="date" required></label> <label>Hora <input name="time" type="time"></label></p>
      <p><label>Nota <input name="note" maxlength="250"></label></p>
      <p><label><input name="weekly" type="checkbox"> Repetir cada semana</label></p>
      <div class="actions"><button type="submit" class="button">Guardar cita</button><button type="button" id="cancel-edit" hidden>Cancelar cambios</button></div>
    </form>
    <p id="status" role="status"></p>
    <h2>Hoy y próximas citas</h2>
    <ul id="upcoming" class="advice-list"></ul>
    <details><summary>Citas pasadas</summary><ul id="past" class="advice-list"></ul></details>
    <noscript>Activa JavaScript para usar la agenda.</noscript>
  </main>
</body>
</html>
