<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Agenda di casa | EatMeFirst</title>
  <script src="../../js/accettazione-it.js" data-proteggi></script>
  <link rel="stylesheet" href="../../sito-bozza/assets/site.css">
  <script defer src="../../js/agenda-it.js?v=20261125"></script>
</head>
<body>
  <header class="site-header wrap"><a class="brand" href="../menu.html">EatMeFirst</a><nav class="actions" aria-label="Menu"><a href="../menu.html">Menu dell’app</a><a href="../spesa/index.html">Lista della spesa</a><a href="../../sito-bozza/IT/agenda.html">Come funziona</a></nav></header>
  <main class="wrap section">
    <h1>Agenda di casa</h1>
    <div class="actions">
      <button type="button" id="example" aria-pressed="false">Prova con Eva</button>
      <button type="button" id="personal" aria-pressed="true">La mia agenda</button>
    </div>
    <p id="mode"></p>
    <div class="actions" id="sample-controls">
      <button type="button" id="clear-example">Azzera la prova</button>
      <button type="button" id="load-example">Ricarica gli esempi</button>
    </div>
    <form id="event-form">
      <h2 id="form-heading">Nuovo impegno</h2>
      <p><label>Titolo <input name="title" required maxlength="100"></label></p>
      <p><label>Data <input name="day" type="date" required></label> <label>Ora <input name="time" type="time"></label></p>
      <p><label>Nota <input name="note" maxlength="250"></label></p>
      <p><label><input name="weekly" type="checkbox"> Ripeti ogni settimana</label></p>
      <div class="actions"><button type="submit" class="button">Salva impegno</button><button type="button" id="cancel-edit" hidden>Annulla modifica</button></div>
    </form>
    <p id="status" role="status"></p>
    <h2>Oggi e prossimi impegni</h2>
    <ul id="upcoming" class="advice-list"></ul>
    <details><summary>Impegni passati</summary><ul id="past" class="advice-list"></ul></details>
    <noscript>Attiva JavaScript per usare l’agenda.</noscript>
  </main>
</body>
</html>
