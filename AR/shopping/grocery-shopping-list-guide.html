    <h1>دليل قائمة التسوّق</h1>
    <p>أضف إلى القائمة ما ينقصك، مثل أرز أو ليمون أو مناديل. في المتجر، ضع علامة على كل صنف تأخذه من الرف.</p>
    <p>الأحمر يشير إلى صنف نفد، والأخضر إلى صنف قد ينفد، والرمادي إلى صنف أضفته بنفسك. تسجيل المشتريات في الجرد يتم من شاشة تسجيل المنتجات.</p>
