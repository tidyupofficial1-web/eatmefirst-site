    <h1>دليل الملاحظات والصور</h1>
    <p>اكتب ملاحظة أو اختر صورة من الجهاز. يمكنك أيضًا فتح الكاميرا ثم التقاط صورة. اضغط زر الحفظ لإضافتها إلى اللوحة.</p>
    <p>يمكنك تنزيل الصورة إذا أردت إرسالها بنفسك. حذف الملاحظة وصورتها من اللوحة إجراء نهائي ولا يزيل الصورة من معرض الهاتف.</p>
