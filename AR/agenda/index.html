<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>مفكّرة المنزل | EatMeFirst</title>
  <link rel="stylesheet" href="../../sito-bozza/assets/site.css">
  <script defer src="../../js/agenda-texts.js?v=language-preview"></script>
  <script defer src="../../js/agenda-it.js?v=language-preview"></script>
</head>
<body>
  <script src="../../js/ingresso-ja-pt.js" data-proteggi></script>
  <header class="site-header wrap"><a class="brand" href="../../sito-bozza/AR/index.html">EatMeFirst</a><nav class="actions" aria-label="طريقة الاستخدام"><a href="../menu.html">قائمة التطبيق</a><a href="../../sito-bozza/AR/index.html#household">طريقة الاستخدام</a></nav></header>
  <main class="wrap section">
    <h1>مفكّرة المنزل</h1>
    <div class="actions">
      <button type="button" id="example" aria-pressed="false">جرّب مع ليلى</button>
      <button type="button" id="personal" aria-pressed="true">مفكّرتي</button>
    </div>
    <p id="mode"></p>
    <div class="actions" id="sample-controls">
      <button type="button" id="clear-example">امسح المواعيد التجريبية</button>
      <button type="button" id="load-example">أعد المواعيد التجريبية</button>
    </div>
    <form id="event-form">
      <h2 id="form-heading">موعد جديد</h2>
      <p><label>العنوان <input name="title" dir="auto" required maxlength="100"></label></p>
      <p><label>التاريخ <input name="day" type="date" required></label> <label>الوقت <input name="time" type="time"></label></p>
      <p><label>ملاحظة <input name="note" dir="auto" maxlength="250"></label></p>
      <p><label><input name="weekly" type="checkbox"> كرّر كل أسبوع</label></p>
      <div class="actions"><button type="submit" class="button">احفظ الموعد</button><button type="button" id="cancel-edit" hidden>إلغاء التعديل</button></div>
    </form>
    <p id="status" role="status"></p>
    <h2>مواعيد امصطفىم والمواعيد القادمة</h2>
    <ul id="upcoming" class="advice-list"></ul>
    <details><summary>المواعيد السابقة</summary><ul id="past" class="advice-list"></ul></details>
    <noscript>فعّل JavaScript لاستخدام المفكّرة.</noscript>
  </main>
</body>
</html>
