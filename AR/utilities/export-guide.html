<h1>النقل باستخدام ملف</h1>
<p>صدّر الجرد من الجهاز الذي يحتوي على أحدث البيانات، ثم انقل الملف إلى الجهاز الآخر. افتح «الأدوات» واختر «استيراد الجرد». راجع المقارنة قبل تأكيد الاستبدال.</p>
<p>يستبدل الاستيراد الجرد الحالي. إذا عدّلت الجرد على الجهازين كلٌّ على حدة، فلن تُدمج التغييرات.</p>
