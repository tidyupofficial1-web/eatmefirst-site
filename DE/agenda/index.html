<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Familienplaner | EatMeFirst</title>
  <link rel="stylesheet" href="../../sito-bozza/assets/site.css">
  <script defer src="../../js/agenda-texts.js?v=20261126"></script>
  <script defer src="../../js/agenda-it.js?v=20261126"></script>
</head>
<body>
  <header class="site-header wrap"><a class="brand" href="../menu.html">EatMeFirst</a><nav class="actions" aria-label="App-Menü"><a href="../menu.html">App-Menü</a><a href="../einkaufsliste/index.html">Einkaufsliste</a><a href="../../sito-bozza/DE/agenda.html">So geht’s</a></nav></header>
  <main class="wrap section">
    <h1>Familienplaner</h1>
    <div class="actions">
      <button type="button" id="example" aria-pressed="false">Mit Eva ausprobieren</button>
      <button type="button" id="personal" aria-pressed="true">Mein Planer</button>
    </div>
    <p id="mode"></p>
    <div class="actions" id="sample-controls">
      <button type="button" id="clear-example">Testplaner leeren</button>
      <button type="button" id="load-example">Beispiele neu laden</button>
    </div>
    <form id="event-form">
      <h2 id="form-heading">Neuer Termin</h2>
      <p><label>Titel <input name="title" required maxlength="100"></label></p>
      <p><label>Datum <input name="day" type="date" required></label> <label>Uhrzeit <input name="time" type="time"></label></p>
      <p><label>Notiz <input name="note" maxlength="250"></label></p>
      <p><label><input name="weekly" type="checkbox"> Wöchentlich wiederholen</label></p>
      <div class="actions"><button type="submit" class="button">Termin speichern</button><button type="button" id="cancel-edit" hidden>Bearbeitung abbrechen</button></div>
    </form>
    <p id="status" role="status"></p>
    <h2>Heute und demnächst</h2>
    <ul id="upcoming" class="advice-list"></ul>
    <details><summary>Vergangene Termine</summary><ul id="past" class="advice-list"></ul></details>
    <noscript>Aktivieren Sie JavaScript, um den Planer zu verwenden.</noscript>
  </main>
</body>
</html>
